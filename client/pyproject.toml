[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgedet-z20-client"
version = "0.1.0"
description = "EdgeDet-Z20 protocol client, virtual board, and dashboard"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
reference = ["numpy>=1.26,<3"]
dashboard = ["numpy>=1.26,<3", "opencv-python>=4.9,<5", "PySide6>=6.7,<7"]
test = ["pytest>=8,<9"]

[project.scripts]
edz-virtual-board = "edgedet.virtual_board:main"
edz-dashboard = "edgedet.dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgedet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".."]
