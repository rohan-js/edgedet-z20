name: host-tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/train.txt
      - run: python -m pytest
      - run: python -m compileall -q model client verification benchmarks scripts
      - run: python -m verification.soak_virtual_board --frames 100 --fragment-size 7 --output artifacts/work/verification/virtual_board_smoke.json

  portable-c:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: pwsh
        run: .\runtime\tests\build_and_test.ps1
